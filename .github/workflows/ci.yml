name: Flask CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  docker:
    needs: test
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/ci-cd-flask-app"

          docker build \
            -t "$IMAGE:${GITHUB_SHA}" \
            -t "$IMAGE:latest" .

      - name: Push versioned image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/ci-cd-flask-app"

          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"


  deploy:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      deploy_id: ${{ steps.trigger.outputs.deploy_id }}

    steps:
      - name: Trigger Render deployment
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          IMAGE="docker.io/shivanshdutt/ci-cd-flask-app:${GITHUB_SHA}"

          RESPONSE=$(curl --fail --show-error --silent \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg image "$IMAGE" '{imageUrl: $image}')")

          DEPLOY_ID=$(echo "$RESPONSE" | jq -r '.id')

          if [ -z "$DEPLOY_ID" ] || [ "$DEPLOY_ID" = "null" ]; then
            echo "Could not retrieve deployment ID"
            exit 1
          fi

          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Triggered deployment: $DEPLOY_ID"


  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
  
    steps:
      - name: Wait and verify health
        run: |
          URL="https://ci-cd-flask-app-37ye.onrender.com"
    
          curl -f --retry 10 \
            --retry-delay 10 \
            --retry-all-errors \
            "$URL/health"
    
      - name: Verify home endpoint
        run: |
          curl -f https://ci-cd-flask-app-37ye.onrender.com/

  check-render-history:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Render deployment history
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail --show-error \
            --request GET \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=5" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json"